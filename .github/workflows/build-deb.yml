# Builds the tweak alone as a .deb, on demand. Run it from the Actions tab.
#
# The .deb is only the tweak. Injected by hand it misses what the IPA build adds to the app itself (the glass
# tab bar, the Live Activity, Music Haptics in the background, Connect's local discovery), so for the full
# redesign build the IPA ("Build IPA from your own Spotify IPA").
name: Build .deb

on:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode ==="
          xcodebuild -version
          xcode-select -p

          echo "=== iOS SDK ==="
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "SDK: $SDK_VERSION"
          xcrun --sdk iphoneos --show-sdk-path

          SDK_MAJOR="${SDK_VERSION%%.*}"
          if (( SDK_MAJOR < 26 )); then
            echo "::error::iOS SDK 26 or later is needed."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: brew install make dpkg ldid

      - name: Check layers
        run: bash scripts/check-layers.sh

      - name: Build
        run: env -u MAKELEVEL make -C tweak clean package

      - name: List the .deb
        run: |
          ls -lh tweak/packages/*.deb
          echo "### .deb built" >> "$GITHUB_STEP_SUMMARY"
          for f in tweak/packages/*.deb; do echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"; done

      - uses: actions/upload-artifact@v5
        with:
          name: vitrine-deb
          path: tweak/packages/*.deb
          if-no-files-found: error
