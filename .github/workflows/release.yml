# Every push to main updates one release PR, or can be triggered manually.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build:
    runs-on: macos-26
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode ==="
          xcodebuild -version
          xcode-select -p

          echo "=== iOS SDK ==="
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "SDK seleccionado: $SDK_VERSION"
          xcrun --sdk iphoneos --show-sdk-path

          SDK_MAJOR="${SDK_VERSION%%.*}"
          if (( SDK_MAJOR < 26 )); then
            echo "::error::Se necesita el SDK de iOS 26 o posterior."
            exit 1
          fi

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: brew install make dpkg ldid

      - name: Build
        run: env -u MAKELEVEL make -C tweak clean package

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotifyglass-deb
          path: tweak/packages/*.deb
